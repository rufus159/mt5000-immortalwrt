# Touch: force workflow re-index after migration to foxsfire/gl-mt5000
name: Build ImmortalWrt for GL.iNet MT5000

on:
  workflow_dispatch:
    inputs:
      iwrt_ref:
        description: 'ImmortalWrt 基线 commit (留空则用默认基线 4765b65762; 显式填写时优先, 但需自行确保补丁能套用)'
        required: false
        default: ''
        type: string
      lan_ip:
        description: '默认 LAN IP (如 192.168.5.1)'
        required: false
        default: '192.168.5.1'
        type: string
      timezone:
        description: '默认时区'
        required: false
        default: 'Asia/Shanghai'
        type: choice
        options:
          - Asia/Shanghai
          - Asia/Hong_Kong
          - Asia/Taipei
          - Asia/Tokyo
          - Asia/Singapore
          - Europe/Berlin
          - UTC
      ui_lang:
        description: 'LuCI 界面语言'
        required: false
        default: 'zh-cn'
        type: choice
        options:
          - zh-cn
          - en
      rootfs_size:
        description: '软件包分区大小 (MB)'
        required: false
        default: '2048'
        type: choice
        options:
          - '1024'
          - '2048'
          - '4096'
          - '8192'
      extra_services:
        description: '附加服务: none=都不装; mwan3=多线管理(LuCI 网络→Multi WAN, 编入时自动只接管 IPv4, 不影响 IPv6); docker=Docker+Dockerman; docker+mwan3=两者都装'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'mwan3'
          - 'docker'
          - 'docker+mwan3'
      pppoe:
        description: '预置 PPPoE 拨号 (WAN 口 eth1)'
        required: false
        default: false
        type: boolean
      pppoe_username:
        description: 'PPPoE 宽带账号 (启用 PPPoE 时填写)'
        required: false
        default: ''
        type: string
      pppoe_password:
        description: 'PPPoE 密码 (留空则使用仓库 Secret: PPPOE_PASSWORD)'
        required: false
        default: ''
        type: string
      enable_ipv6:
        description: '启用 IPv6 (参考 Aethersailor wiki: WAN 委托前缀 + LAN RA/SLAAC 下发)'
        required: false
        default: false
        type: boolean
      lan_ipv6_assign:
        description: 'LAN IPv6 分配长度 ip6assign (上游只给 /64 时用 64; 要再向二级路由委派用 60/56)'
        required: false
        default: '64'
        type: choice
        options:
          - '64'
          - '60'
          - '56'
          - 'disabled'
      lan_ipv6_suffix:
        description: 'LAN 接口自身 IPv6 后缀 ip6ifaceid'
        required: false
        default: 'eui64'
        type: choice
        options:
          - 'eui64'
          - 'random'
          - '::1'
      lan_ipv6_dhcpv6:
        description: 'LAN DHCPv6 服务 (disabled = 纯 SLAAC, 兼容安卓; server = 有状态分配)'
        required: false
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'server'
      lan_ipv6_dns:
        description: '向客户端通告路由器为 IPv6 DNS (false = 客户端继续用 IPv4 DNS, 保持 OpenClash 分流)'
        required: false
        default: false
        type: boolean
      hostname:
        description: '路由器主机名'
        required: false
        default: 'ImmortalWrt'
        type: string
      root_password:
        description: '默认 root 密码 (默认留空 = 无密码; 仅在首启且 root 尚无密码时写入)'
        required: false
        default: ''
        type: string
      extra_feeds:
        description: '额外软件源, 多个用 | 分隔, 每个为标准 feeds.conf 行。例: src-git ken https://github.com/kenzok8/openwrt-packages;main'
        required: false
        default: ''
        type: string
      extra_packages:
        description: '额外编译进固件的软件包, 空格分隔。例: luci-app-zerotier htop'
        required: false
        default: ''
        type: string

# 同一 ref 只保留一个构建。历史上 5 次 cancelled 都是重复点 Run workflow
# 后旧任务被人工取消，白白烧掉 300+ 分钟 runner 时间。开了这个以后新任务
# 会自动取消在跑的旧任务。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write    # Prune stale caches 需要删除缓存

    env:
      # 基线解析必须发生在 job 级 env 表达式里，而不是某个 step 里。
      # 原因：Prune stale caches 是第 1 个 step，它的缓存 key 依赖
      # IWRT_REF。如果像之前那样在 Validate inputs（第 6 个 step）里才
      # echo IWRT_REF=... >> GITHUB_ENV，Prune 运行时 IWRT_REF 还是空串，
      # key 匹配变成 "dl--*"/"stage--*"，一个都匹配不上——实测会把当前
      # 基线刚存下的缓存也误删（r11 日志: keeping: dl--* and stage--*）。
      # GitHub 表达式在 job 启动时就求值，所有 step 从一开始就能读到。
      IWRT_REF: ${{ github.event.inputs.iwrt_ref || '4765b65762' }}
      # 并行度：ubuntu-24.04 标准 runner 是 4 vCPU / 16G。
      # nproc+1 = 5 对 16G 是安全的；但显式写在 env 里可复现、可调，
      # 比散落在各 step 里的 $(nproc)+1 更可维护。
      BUILD_JOBS: 5
      LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.5.1' }}
      TIMEZONE: ${{ github.event.inputs.timezone || 'Asia/Shanghai' }}
      UI_LANG: ${{ github.event.inputs.ui_lang || 'zh-cn' }}
      ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size || '2048' }}
      # 第三方源（iStore / quickstart / luci-app-run）已整体移除：本项目
      # 只用官方 feeds，固件包集 = 官方默认 + seed 里显式列出的那几项。
      # 需要某个第三方包时走 extra_feeds + extra_packages，或直接改 seed。
      EXTRA_SERVICES: ${{ github.event.inputs.extra_services || 'none' }}
      PPPOE: ${{ github.event.inputs.pppoe }}
      PPPOE_USERNAME: ${{ github.event.inputs.pppoe_username }}
      PPPOE_PASSWORD: ${{ github.event.inputs.pppoe_password }}
      PPPOE_SECRET: ${{ secrets.PPPOE_PASSWORD }}
      ENABLE_IPV6: ${{ github.event.inputs.enable_ipv6 || 'false' }}
      LAN_IPV6_ASSIGN: ${{ github.event.inputs.lan_ipv6_assign || '64' }}
      LAN_IPV6_SUFFIX: ${{ github.event.inputs.lan_ipv6_suffix || 'eui64' }}
      LAN_IPV6_DHCPV6: ${{ github.event.inputs.lan_ipv6_dhcpv6 || 'disabled' }}
      LAN_IPV6_DNS: ${{ github.event.inputs.lan_ipv6_dns || 'false' }}
      HOSTNAME: ${{ github.event.inputs.hostname || 'ImmortalWrt' }}
      ROOT_PASSWORD: ${{ github.event.inputs.root_password }}
      EXTRA_FEEDS: ${{ github.event.inputs.extra_feeds }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}

    steps:
      # GitHub 单仓库缓存上限 10G，超了按 LRU 淘汰。这里有三份缓存要共存：
      #   dl-<ref>-*       ~2.5G  源码 tarball
      #   stage-<ref>-*    3-5G   staging_dir (工具链)
      #   ccache (在 stage 里) 1G
      # 合计已经接近上限，所以构建结束后把「不是当前基线」的旧缓存删掉，
      # 避免上一版 stage-* 把 dl-* 挤出去。需要 actions:write 权限。
      - name: Prune stale caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 保留当前基线的 dl-/stage- 缓存，删掉其它基线的，避免 10G 配额
          # 被上一版工具链占满后把 dl/ 挤出去（LRU 淘汰）。
          #
          # 防御：IWRT_REF 现在由 job 级 env 表达式解析，理论上这里非空；
          # 但万一为空（例如表达式未来被改坏），宁可什么都不删，也不能
          # 用空串匹配把全部缓存删光。
          if [ -z "$IWRT_REF" ]; then
            echo "IWRT_REF 为空，跳过 prune（不删任何缓存）"
            exit 0
          fi
          echo "keeping: dl-${IWRT_REF}-* and stage-${IWRT_REF}-*"
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' > /tmp/caches.txt 2>/dev/null || : > /tmp/caches.txt

          n=0
          while read -r id key; do
            [ -z "$id" ] && continue
            case "$key" in
              "dl-${IWRT_REF}-"*|"stage-${IWRT_REF}-"*) continue ;;
            esac
            echo "deleting stale: $key"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done < /tmp/caches.txt
          echo "pruned $n stale cache(s)"

      - name: Free disk space
        run: |
          # 实测 ubuntu-24.04 runner：清理前约 31G/145G 已用，清理后可用约 114G，
          # 而 OpenWrt 全量编译约需 45G —— 单看编译本身不缺空间（历史 7 次失败
          # 没有一次是 No space）。但本工作流要 restore 约 4G 的 staging_dir
          # 缓存，解压时和编译峰值叠加，多腾一些是几乎零成本的保险。
          #
          # 注意不要 swapoff：runner 自带的 4G swap 是 make -j5 内存峰值的
          # 兜底，为了 4G 磁盘丢掉它不划算。
          echo "=== before ==="; df -h /; free -h
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/lib/node_modules \
            /opt/az \
            /usr/lib/jvm || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "=== after ==="; df -h /; free -h; swapon --show || true

      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # GitHub runner 在 Azure 美国机房，archive.ubuntu.com 偶发被限速
          # （r29 实测 30.4 kB/s，装了 30 分钟；正常是 6 秒）。
          # 换成 azure.archive.ubuntu.com 同机房镜像，异常时自动回退官方源。
          sudo sed -i 's|http://archive.ubuntu.com|https://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|https://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler dialog dwarves ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            re2c rsync scons squashfs-tools subversion swig texinfo unzip \
            vim wget xmlto xxd zlib1g-dev

      - name: Validate inputs
        run: |
          if [ -n "$IWRT_REF" ]; then
            echo "iwrt_ref 显式指定: $IWRT_REF"
          fi
          # 基线默认值解析已上移到 job 级 env（IWRT_REF 表达式），这里
          # 不再重复 if/elif 赋值，只保留结果核对。CI 和本地脚本
          # (build-local.sh resolve_inputs) 的默认基线必须保持一致。
          echo "::notice::基线: $IWRT_REF (默认 4765b65762, 2026-11-05 / 内核6.18)"
          echo "$LAN_IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || { echo "::error::非法 LAN IP: $LAN_IP"; exit 1; }
          if [ "$PPPOE" = "true" ] && [ -z "$PPPOE_USERNAME" ]; then
            echo "::error::启用了 PPPoE 但未填写账号 (pppoe_username)"; exit 1
          fi
          if [ "$PPPOE" = "true" ] && [ -z "$PPPOE_PASSWORD" ] && [ -z "$PPPOE_SECRET" ]; then
            echo "::error::PPPoE 密码为空: 请填写 pppoe_password 或配置仓库 Secret PPPOE_PASSWORD"; exit 1
          fi
          # 附加服务 (workflow_dispatch 最多 25 个输入, docker/mwan3 合并成一个选择项)
          case "$EXTRA_SERVICES" in
            none|mwan3|docker|docker+mwan3) ;;
            *) echo "::error::非法 extra_services: $EXTRA_SERVICES (可选 none/mwan3/docker/docker+mwan3)"; exit 1 ;;
          esac
          case "$EXTRA_SERVICES" in *docker*) INCLUDE_DOCKER=true ;; *) INCLUDE_DOCKER=false ;; esac
          case "$EXTRA_SERVICES" in *mwan3*)  ENABLE_MWAN3=true  ;; *) ENABLE_MWAN3=false  ;; esac
          printf 'INCLUDE_DOCKER=%s\nENABLE_MWAN3=%s\n' "$INCLUDE_DOCKER" "$ENABLE_MWAN3" >> "$GITHUB_ENV"
          echo "::notice::附加服务: $EXTRA_SERVICES (docker=$INCLUDE_DOCKER, mwan3=$ENABLE_MWAN3)"
          if [ "$ENABLE_IPV6" = "true" ]; then
            case "$LAN_IPV6_ASSIGN" in
              56|60|64|disabled) ;;
              *) echo "::error::非法 lan_ipv6_assign: $LAN_IPV6_ASSIGN (可选 56/60/64/disabled)"; exit 1 ;;
            esac
            case "$LAN_IPV6_SUFFIX" in
              eui64|random|::1) ;;
              *) echo "::error::非法 lan_ipv6_suffix: $LAN_IPV6_SUFFIX (可选 eui64/random/::1)"; exit 1 ;;
            esac
            case "$LAN_IPV6_DHCPV6" in
              disabled|server) ;;
              *) echo "::error::非法 lan_ipv6_dhcpv6: $LAN_IPV6_DHCPV6 (可选 disabled/server)"; exit 1 ;;
            esac
          fi

      # 基线 pin 成 commit 是有必要的（分支 HEAD 会漂，补丁随时套不上），
      # 但 pin 的 SHA 一旦被上游 rebase / gc 回收，后面所有步骤都会在
      # `git checkout` 处静默失败——日志里只有一行 "reference is not a tree"，
      # 很容易被当成补丁问题排查半天。所以这里先做存在性校验，失败时把当前
      # 可用的分支 HEAD 打出来，直接复制进 iwrt_ref 就能恢复。
      # 另外记录实际解析出的 BASE_SHA 与提交时间，方便事后定位"哪一版源码
      # 编出来的固件"——分支 HEAD 是会动的，光记 pin 字符串不够。
      - name: Clone ImmortalWrt source
        run: |
          git clone --filter=blob:none https://github.com/immortalwrt/immortalwrt
          cd immortalwrt
          git config advice.detachedHead false

          # 用 cat-file -e 判定，不要用 rev-parse --verify：这是带
          # --filter=blob:none 的 partial clone，对不存在的对象 rev-parse 会
          # 先尝试 lazy-fetch，拿到 "not our ref" 之后仍可能吐出一个前缀匹配
          # 到的近似 SHA 且退出码为 0，判断完全不可靠。
          if ! git cat-file -e "${IWRT_REF}^{commit}" 2>/dev/null; then
            echo "::error::基线 ${IWRT_REF} 在克隆到的仓库中不存在（上游已 rebase 或 gc 回收），拒绝继续构建"
            echo "::error::请确认该 SHA 是否仍可见: gh api repos/immortalwrt/immortalwrt/commits/${IWRT_REF}"
            echo "---- 当前可用基线（可直接填进 iwrt_ref）----"
            git ls-remote origin 'refs/heads/master' 2>/dev/null | sed 's/^/  /'
            echo "--------------------------------------------"
            exit 1
          fi

          git checkout --detach "$IWRT_REF"
          BASE_SHA=$(git rev-parse HEAD)
          BASE_DATE=$(git log -1 --format='%cI')
          BASE_SUBJ=$(git log -1 --format='%s')
          echo "base: ${BASE_SHA} (${BASE_DATE}) ${BASE_SUBJ}"

          # 对象存在 ≠ 基线长期可用。上游若 force-push / rebase，旧提交会变成
          # 悬空对象：partial clone 恰好带出来就能编，但谁都看不到它，下次 gc
          # 就没了。这种情况只警告、不中断（本次构建是有效的），但必须留痕。
          if [ -z "$(git tag --points-at "$BASE_SHA")" ] \
             && ! git merge-base --is-ancestor "$BASE_SHA" origin/master 2>/dev/null; then
            echo "::warning::基线 ${BASE_SHA} 既不是 tag、也不在 master 的可达历史里：它是悬空对象，上游下次 gc 会回收，请尽快改成分支 HEAD 或 tag。"
          fi

          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          {
            echo "### 构建基线"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 请求的 ref | \`${IWRT_REF}\` |"
            echo "| 实际提交 | \`${BASE_SHA}\` |"
            echo "| 提交时间 | ${BASE_DATE} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # dl/ 里是上游源码 tarball，和本仓库的补丁/配置无关。
      # 原 key 里带 hashFiles('patches/*.patch')，导致改任何补丁都会让
      # 2.4~2.6G 的下载缓存整体失效重新拉一遍。这里只按源码基线区分，
      # 再用 restore-keys 做前缀回退，基线变了也能复用绝大部分包。
      - name: Cache downloaded sources (dl/)
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: dl-${{ env.IWRT_REF }}-${{ hashFiles('config/mt5000.seed') }}
          restore-keys: |
            dl-${{ env.IWRT_REF }}-
            dl-

      # staging_dir 是编译工具链（gcc/binutils bootstrap + host 工具 +
      # target 库），单次重编 35~55 分钟，是整条流水线里最贵的一段。
      # ccache 再缓存 C/C++ 目标文件。两者一起能把增量构建压到几十分钟。
      #
      # 与 dl/ 不同，stage key 必须绑定补丁集：staging_dir 里有
      # toolchain/kernel-headers 装出来的内核头 + ccache 目标文件，补丁
      # （尤其 795-11 改 include/net/dsa.h）变了还复用旧 stage 缓存，
      # 会把旧内核头/旧目标文件带进新固件。宁可让改补丁后的首次构建冷编一次。
      # 注意：内核源码树本体在 build_dir/（未缓存），每次都会重新解压打补丁，
      # 所以这里防的是安装产物与 ccache，不是内核源码树本身。
      # restore-keys 只放宽 rootfs_size，去掉原来跨基线/跨配置的
      # stage-<ref>- / stage- 两条过宽前缀（会误命中完全不同的缓存）。
      - name: Cache toolchain + ccache (staging_dir)
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/staging_dir
            immortalwrt/.ccache
          key: stage-${{ env.IWRT_REF }}-${{ hashFiles('config/mt5000.seed', 'patches/*.patch') }}-${{ env.ROOTFS_SIZE }}
          restore-keys: |
            stage-${{ env.IWRT_REF }}-${{ hashFiles('config/mt5000.seed', 'patches/*.patch') }}-

      - name: Apply MT5000 device patch
        run: |
          cd immortalwrt
          # patches/ 按「建文件 -> 改文件」严格分层，必须按编号顺序套：
          #   0001 设备支持本体（openwrt PR #24237 head + 该 PR 的审阅反馈修复，
          #        自 dmsza/openwrt 移植）+ RTL8366UB 驱动(795-10) + 802.1Q
          #        tagger 与 PPE 出口(795-11) + dummy NAPI 顺序修复(795-12)
          #   0002 795-11/795-12 的 VLAN offload 与 NAPI 清理修复 (dmsza 8fbeeb6)
          #   0003 交换机初始化强化 + BPDU/IGMP/MLD 陷阱到 CPU (PR head 89a10ec)
          #   0004 tagger 同步(控制帧解码 + mac_header 修复) + factory nvmem 单元
          #        (PR head 1713e8be63)
          #   0005 rtl8366ub get_stats64（端口统计不再退化成 CPU 口聚合值）
          #   0006 热保护与 u-boot-env 噪声修复（只改 filogic config）
          #   0007 port_max_mtu（巨帧）
          # 0002-0007 只改 0001 建出来的文件，不受上游漂移影响；
          # 会随基线变动的是 0001 里那 10 个上游 hunk。
          # 补丁只对已验证的基线保证干净套用。
          for p in ../patches/*.patch; do
            echo "applying $p"
            git apply --check "$p" && git apply "$p" || { echo "::error::$p 应用失败; 基线 $IWRT_REF 可能已变动, 请显式指定已知可用 iwrt_ref 或基于 master 重新生成补丁"; exit 1; }
          done

      - name: Overlay files/ and feeds
        run: |
          cd immortalwrt
          cp -r ../files/. ./
          # ---- 只用官方 feeds ----
          # 固件包集 = 官方 filogic 默认 + config/mt5000.seed 里显式列出的项。
          # 第三方源（istore / wukongdaily / nas-packages）已整块删除，它们是
          # 构建时间的净负担，且与「只用官方源」的目标冲突。
          if [ -n "$EXTRA_FEEDS" ]; then
            printf '%s' "$EXTRA_FEEDS" | tr '|' '\n' | while IFS= read -r FEEDLINE; do
              FEEDLINE=$(printf '%s' "$FEEDLINE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              case "$FEEDLINE" in ''|'#'*) continue ;; esac
              echo "$FEEDLINE" >> feeds.conf.default
              echo "added extra feed: $FEEDLINE"
            done
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ -n "$EXTRA_FEEDS" ]; then
            # extra feeds take precedence over stock feeds on package-name conflicts
            for FEED in $(printf '%s' "$EXTRA_FEEDS" | tr '|' '\n' | sed -n 's/^src-git[[:space:]][[:space:]]*\([^ ;]*\).*/\1/p'); do
              echo "force-installing packages from extra feed: $FEED"
              ./scripts/feeds install -a -f -p "$FEED" || echo "::warning::feed $FEED 强制安装失败(名称是否正确?)"
            done
          fi

      - name: Generate .config
        run: |
          cd immortalwrt
          cp ../config/mt5000.seed .config

          # --- parameterize seed ---
          LAN_BC="${LAN_IP%.*}.255"
          sed -i "s|^CONFIG_TARGET_ROOTFS_PARTSIZE=.*|CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE|" .config
          sed -i "s|^CONFIG_TARGET_PREINIT_IP=.*|CONFIG_TARGET_PREINIT_IP=\"$LAN_IP\"|" .config
          sed -i "s|^CONFIG_TARGET_PREINIT_BROADCAST=.*|CONFIG_TARGET_PREINIT_BROADCAST=\"$LAN_BC\"|" .config

          # 语言: default-settings-chn 依赖 @LUCI_LANG_zh_Hans + luci-i18n-base-zh-cn，
          # 所以中文 i18n 包一定在固件里（zh_Hans 符号会被 defconfig 拉回，改不掉）。
          # 「默认界面语言」由首启脚本 99-luci-lang 决定：写 luci.main.lang=zh_cn
          # 就是中文；不写则 LuCI 走 auto，按浏览器语言协商。
          # LuCI 全套由 config/mt5000.seed 的 CONFIG_PACKAGE_luci=y 保证
          # (master 的 include/target.mk 不追加 tweak 段, 必须显式选中,
          #  否则 uhttpd / luci-mod-* / bootstrap 主题全都不会被拉起)

          if [ "$INCLUDE_DOCKER" = "true" ]; then
            printf '%s\n' \
              'CONFIG_KERNEL_CGROUPS=y' \
              'CONFIG_KERNEL_CGROUP_CPUACCT=y' \
              'CONFIG_KERNEL_CGROUP_DEVICE=y' \
              'CONFIG_KERNEL_CGROUP_FREEZER=y' \
              'CONFIG_KERNEL_CGROUP_SCHED=y' \
              'CONFIG_KERNEL_MEMCG=y' \
              'CONFIG_KERNEL_NAMESPACES=y' \
              'CONFIG_PACKAGE_cgroupfs-mount=y' \
              'CONFIG_PACKAGE_docker=y' \
              'CONFIG_PACKAGE_dockerd=y' \
              'CONFIG_PACKAGE_luci-app-dockerman=y' >> .config
          fi

          # mwan3 (extra_services 含 mwan3 时). 编入时同时生成首启修复脚本 99-mwan3-ipv4:
          # mwan3 自带 default_rule_v6 -> balanced 策略, 而 balanced 没有 IPv6
          # 成员时会给每个 IPv6 包打上 unreachable 标记(ip -6 rule fwmark
          # 0x3e00/0x3f00 unreachable), 路由器与下游设备的 IPv6 全部
          # ENETUNREACH(症状: 有公网 IPv6 地址但上不了 IPv6 网站)。
          if [ "$ENABLE_MWAN3" = "true" ]; then
            printf '%s\n' \
              'CONFIG_PACKAGE_mwan3=y' \
              'CONFIG_PACKAGE_luci-app-mwan3=y' >> .config
          fi

          if [ -n "$EXTRA_PACKAGES" ]; then
            for PKG in $EXTRA_PACKAGES; do
              case "$PKG" in '#'*) continue ;; esac
              printf 'CONFIG_PACKAGE_%s=y\n' "$PKG" >> .config
            done
          fi

          make defconfig

          echo "=== sanity check ==="
          grep -qE 'TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y' .config || { echo "::error::设备目标缺失"; exit 1; }
          if [ "$ENABLE_MWAN3" = "true" ]; then
            for U in mwan3 luci-app-mwan3; do
              grep -qE "^CONFIG_PACKAGE_${U}=y" .config || { echo "::error::多线管理组件缺失: $U (extra_services 含 mwan3 但未编入?)"; exit 1; }
            done
          fi
          grep -qE '^CONFIG_PACKAGE_(luci|luci-light)=y' .config      || { echo "::error::LuCI 套件未生效 (config/mt5000.seed 的 CONFIG_PACKAGE_luci=y)"; exit 1; }
          grep -qE '^CONFIG_PACKAGE_uhttpd=y' .config                 || { echo "::error::uhttpd 缺失: LuCI 无 Web 服务器, 管理页面将无法访问"; exit 1; }
          # 25.12 filogic 默认包集对齐项 (master 的 target.mk 不追加 tweak 段,
          # 全靠 config/mt5000.seed 显式写出; 少一个就与 25.12 默认行为不一致)
          for U in block-mount default-settings-chn kmod-nf-nathelper; do
            grep -qE "^CONFIG_PACKAGE_${U}=y" .config || { echo "::error::25.12 默认包集对齐项缺失: $U (config/mt5000.seed 被误删?)"; exit 1; }
          done
          grep -q "CONFIG_TARGET_PREINIT_IP=\"$LAN_IP\"" .config       || { echo "::error::LAN IP 未生效"; exit 1; }
          grep -qE "CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE" .config || { echo "::error::分区大小未生效"; exit 1; }
          # 内核调试能力 (pr_debug/dev_dbg 运行时开关, 依赖 debugfs)
          grep -qE '^CONFIG_KERNEL_DYNAMIC_DEBUG=y' .config            || { echo "::error::CONFIG_KERNEL_DYNAMIC_DEBUG 未生效 (config/mt5000.seed 被改动?)"; exit 1; }
          grep -qE '^CONFIG_KERNEL_DEBUG_FS=y' .config                 || { echo "::error::debugfs 未开启, dynamic debug 无法在运行时控制"; exit 1; }
          if [ -n "$EXTRA_PACKAGES" ]; then
            MISSING=""
            for PKG in $EXTRA_PACKAGES; do
              case "$PKG" in '#'*) continue ;; esac
              grep -q "^CONFIG_PACKAGE_${PKG}=y" .config || MISSING="$MISSING $PKG"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::以下额外软件包未生效(名称错误或依赖未满足):$MISSING"
              exit 1
            fi
          fi
          echo "sanity check passed"

      # staging_dir 从缓存解压回来后，里面的文件 mtime 是打包时间，往往比
      # 刚生成的 .config / 刚应用的内核补丁更旧。OpenWrt 的依赖追踪完全靠
      # 时间戳，这会让它认为 toolchain 需要重建，等于白缓存。
      # 把 stamp 目录整体 touch 到现在，让它认定工具链是最新的。
      - name: Refresh toolchain stamps after cache restore
        run: |
          cd immortalwrt
          if [ -d staging_dir ]; then
            echo "staging_dir present ($(du -sh staging_dir 2>/dev/null | cut -f1)) — refreshing stamp mtimes"
            find staging_dir -type d -name stamp -exec touch -c {} + 2>/dev/null || true
            find staging_dir -path '*/stamp/*' -type f -exec touch -c {} + 2>/dev/null || true
            ls -d staging_dir/*/stamp 2>/dev/null | head -5 || true
          else
            echo "no staging_dir cache (cold build) — nothing to refresh"
          fi

      - name: Generate first-boot customization (uci-defaults)
        run: |
          cd immortalwrt
          UD=files/etc/uci-defaults
          mkdir -p "$UD"

          # timezone (POSIX TZ for busybox)
          case "$TIMEZONE" in
            Asia/Shanghai)    TZP='CST-8' ;;
            Asia/Hong_Kong)   TZP='HKT-8' ;;
            Asia/Taipei)      TZP='CST-8' ;;
            Asia/Tokyo)       TZP='JST-9' ;;
            Asia/Singapore)   TZP='SGT-8' ;;
            Europe/Berlin)    TZP='CET-1CEST,M3.5.0,M10.5.0/3' ;;
            *)                TZP='UTC0' ;;
          esac
          printf '%s\n' \
            '#!/bin/sh' \
            "uci set system.@system[0].timezone='$TZP'" \
            "uci set system.@system[0].zonename='$TIMEZONE'" \
            'uci commit system' > "$UD/99-timezone"

          # hostname
          printf '%s\n' \
            '#!/bin/sh' \
            "uci set system.@system[0].hostname='$HOSTNAME'" \
            'uci commit system' > "$UD/99-hostname"

          # root password (empty input = keep no password; only written when
          # root has no password yet, so config-keeping sysupgrades never
          # clobber a password the user has already set; runs at S10-boot,
          # before dropbear/uhttpd start)
          if [ -n "$ROOT_PASSWORD" ]; then
            HASH=$(printf '%s' "$ROOT_PASSWORD" | openssl passwd -6 -stdin)
            printf '%s\n' \
              '#!/bin/sh' \
              '# 仅当 root 尚无密码(全新刷机)时写入默认密码;' \
              '# 保留配置升级时 /etc/shadow 随配置保留, 此脚本不会覆盖已设密码' \
              "if grep -q '^root::' /etc/shadow; then" \
              "  sed -i 's|^root::|root:$HASH:|' /etc/shadow" \
              'fi' \
              'exit 0' > "$UD/99-root-password"
          fi

          # UI language
          if [ "$UI_LANG" = "zh-cn" ]; then
            printf '%s\n' \
              '#!/bin/sh' \
              "uci set luci.main.lang='zh_cn'" \
              'uci commit luci' > "$UD/99-luci-lang"
          fi

          # PPPoE (WAN = eth1 on MT5000)
          if [ "$PPPOE" = "true" ]; then
            PP="$PPPOE_PASSWORD"
            [ -z "$PP" ] && PP="$PPPOE_SECRET"
            PPE=$(printf '%s' "$PP" | sed "s/'/'\\\\''/g")
            UPE=$(printf '%s' "$PPPOE_USERNAME" | sed "s/'/'\\\\''/g")
            printf '%s\n' \
              '#!/bin/sh' \
              "uci set network.wan.proto='pppoe'" \
              "uci set network.wan.username='$UPE'" \
              "uci set network.wan.password='$PPE'" \
              'uci commit network' > "$UD/99-pppoe"
          fi

          # IPv6 (参考 Aethersailor/Custom_OpenClash_Rules wiki "OpenWrt IPv6 设置方案")
          #   WAN 侧两种拨号的 PD 机制不同:
          #   PPPoE    -> ppp6-up 以 AUTOIPV6 自动生成动态 wan_6 (dhcpv6+PD),
          #               前提是 wan.ipv6 留空/auto (显式 ipv6=1 会禁用它)
          #   DHCP WAN -> proto dhcp 不会自动生成 wan_6, 需显式 wan6 承载 PD
          #   LAN: 从上游委派前缀中划分子网, RA 服务器 + SLAAC 下发, 关闭 NDP 代理
          if [ "$ENABLE_IPV6" = "true" ]; then
            IU="$UD/99-ipv6"
            printf '%s\n' \
              '#!/bin/sh' \
              '# IPv6 per Aethersailor/Custom_OpenClash_Rules wiki (OpenWrt IPv6 设置方案)' \
              "# 生成参数: ip6assign=$LAN_IPV6_ASSIGN ip6ifaceid=$LAN_IPV6_SUFFIX dhcpv6=$LAN_IPV6_DHCPV6 ipv6_dns=$LAN_IPV6_DNS" \
              '' \
              '# --- WAN: 委托上游前缀 (netifd 核心默认已开, 显式写明以对齐教程) ---' \
              "uci -q set network.wan.delegate='1'" \
              '# 关键: wan.ipv6 必须留空/auto。ppp.sh 只在留空或 auto 时设 AUTOIPV6,' \
              '# 显式 ipv6=1 只做 IPv6CP、不会自动生成动态 wan_6 (旧脚本 r9 上' \
              '# wan_6 缺失的根因), 故必须删掉它 (含保留配置升级时的残留)' \
              'uci -q delete network.wan.ipv6' \
              'uci -q delete network.wan.ip6assign' \
              'uci -q delete network.wan.ip6class' \
              'uci -q delete network.wan.ip6hint' \
              'uci -q delete network.wan.ip6weight' \
              '[ -n "$(uci -q get dhcp.wan)" ] && uci -q set dhcp.wan.ignore=1' > "$IU"
            if [ "$PPPOE" = "true" ]; then
              # PPPoE: ipv6 留空 -> pppd IPv6CP up 后 ppp6-up 自动创建动态 wan_6
              # (proto dhcpv6, ifname @wan, PD 默认开启), 即教程方案A 的行为;
              # 删除静态 wan6 (出厂默认或旧固件手动残留), 避免与 wan_6 双客户端
              printf '%s\n' \
                '' \
                '# --- PPPoE: 依赖自动生成的动态 wan_6 (dhcpv6 客户端 + PD) ---' \
                'uci -q delete network.wan6' >> "$IU"
            else
              # DHCP WAN: proto dhcp 没有任何自动生成 wan_6 的机制,
              # PD 必须由显式 wan6 (dhcpv6 客户端, 与 wan 同端口) 承载 (教程方案B)
              printf '%s\n' \
                '' \
                '# --- DHCP WAN: 确保 wan6 (dhcpv6 客户端) 存在并承载 PD ---' \
                'uci -q set network.wan6=interface' \
                'WANDEV=$(uci -q get network.wan.device || uci -q get network.wan.ifname)' \
                '[ -n "$WANDEV" ] && uci -q set network.wan6.device="$WANDEV"' \
                "uci -q set network.wan6.proto='dhcpv6'" \
                "uci -q set network.wan6.reqaddress='try'" \
                "uci -q set network.wan6.reqprefix='auto'" >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- LAN: 从委派前缀中划分子网 ---' \
              "uci -q set network.lan.delegate='1'" \
              "uci -q set network.lan.ipv6='1'" \
              "uci -q set network.lan.ip6ifaceid='$LAN_IPV6_SUFFIX'" >> "$IU"
            if [ "$LAN_IPV6_ASSIGN" = "disabled" ]; then
              printf '%s\n' \
                '# 不向下游分配公网 IPv6 前缀' \
                'uci -q delete network.lan.ip6assign' >> "$IU"
            else
              printf '%s\n' \
                "uci -q set network.lan.ip6assign='$LAN_IPV6_ASSIGN'" >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- LAN DHCP 服务器: RA 服务器 + SLAAC, NDP 代理关闭 ---' \
              'uci -q get dhcp.lan >/dev/null || { uci -q set dhcp.lan=dhcp; uci -q set dhcp.lan.interface=lan; }' \
              "uci -q set dhcp.lan.ra='server'" \
              "uci -q set dhcp.lan.ra_slaac='1'" \
              "uci -q set dhcp.lan.ndp='disabled'" \
              "uci -q set dhcp.lan.dhcpv6='$LAN_IPV6_DHCPV6'" >> "$IU"
            if [ "$LAN_IPV6_DHCPV6" = "disabled" ]; then
              printf '%s\n' \
                '# 无 DHCPv6 -> RA 不带 M/O 标志 (纯 SLAAC)' \
                'uci -q delete dhcp.lan.ra_flags' \
                "uci -q add_list dhcp.lan.ra_flags='none'" >> "$IU"
            else
              printf '%s\n' \
                '# 有状态 DHCPv6 -> RA 带 M/O 标志' \
                'uci -q delete dhcp.lan.ra_flags' \
                "uci -q add_list dhcp.lan.ra_flags='managed-config'" \
                "uci -q add_list dhcp.lan.ra_flags='other-config'" >> "$IU"
            fi
            if [ "$LAN_IPV6_DNS" = "true" ]; then
              printf '%s\n' \
                "uci -q set dhcp.lan.dns_service='1'" >> "$IU"
            else
              printf '%s\n' \
                '# 不通告路由器为 IPv6 DNS -> 客户端继续用路由器 IPv4 地址解析, 保持 OpenClash 分流' \
                "uci -q set dhcp.lan.dns_service='0'" \
                'uci -q delete dhcp.lan.dns' >> "$IU"
            fi
            printf '%s\n' \
              '' \
              '# --- dnsmasq: 不过滤 IPv6 AAAA 记录 ---' \
              "uci -q set dhcp.@dnsmasq[0].filter_aaaa='0'" \
              '' \
              'uci -q commit network' \
              'uci -q commit dhcp' \
              'exit 0' >> "$IU"
            [ -s "$IU" ] || { echo "::error::99-ipv6 未生成"; exit 1; }
          fi

          # mwan3 (opt-in): 只让它接管 IPv4, 否则它的默认策略会把 IPv6 打死。
          # 背景: mwan3 自带配置里 default_rule_v6 指向 balanced 策略, 而
          # balanced 只有 IPv4 成员; mwan3 对"策略里没有可用成员"的处理是
          # last_resort unreachable -> 每个 IPv6 包被打上 fwmark 0x3e00,
          # 命中 ip6 rule "fwmark 0x3e00/0x3f00 unreachable"(优先级 2062,
          # 先于 main 表), 路由器自身与下游设备的 IPv6 全部 ENETUNREACH。
          # 现象就是"下游能拿到公网 IPv6 地址, 但访问不了 IPv6 网站",
          # 且 IPv4 完全正常; odhcpd 侧还会因看不到可路由默认路由而把 RA
          # 的 router lifetime 置 0。
          # https 规则没写 family, 默认 v4/v6 都会装; 这里限定为 IPv4。
          if [ "$ENABLE_MWAN3" = "true" ]; then
            cat > "$UD/99-mwan3-ipv4" <<'EOF'
          #!/bin/sh
          # mwan3 默认配置会破坏 IPv6 (见上面的说明):
          #   mwan3.default_rule_v6 -> balanced 策略(无 IPv6 成员)
          #   -> IPv6 包被打 fwmark 0x3e00 -> ip -6 rule unreachable -> 全网 IPv6 不通
          # 修复: 让 mwan3 的规则只作用于 IPv4, 删掉 IPv6 默认规则。
          # 若将来真的要 mwan3 管 IPv6, 需要建 family ipv6 的接口/成员/策略,
          # 仅 uci set mwan3.wan6.enabled='1' 是不够的。
          [ -n "$(uci -q get mwan3.https)" ] && uci -q set mwan3.https.family='ipv4'
          uci -q delete mwan3.default_rule_v6
          uci -q commit mwan3
          exit 0
          EOF
            chmod 755 "$UD/99-mwan3-ipv4"
            [ -s "$UD/99-mwan3-ipv4" ] || { echo "::error::99-mwan3-ipv4 未生成"; exit 1; }
          fi

          chmod 755 "$UD"/99-*
          ls -la "$UD"/

      - name: Record build metadata
        run: |
          {
            echo '## 构建元信息'
            echo
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| iwrt_ref | $IWRT_REF |"
            echo "| rootfs_size | $ROOTFS_SIZE |"
            echo "| extra_services | $EXTRA_SERVICES |"
            echo "| enable_ipv6 | $ENABLE_IPV6 |"
            echo "| pppoe | $PPPOE |"
            echo "| build_jobs | ${BUILD_JOBS:-5} |"
            echo "| runner | $RUNNER_NAME ($RUNNER_ARCH) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j"${BUILD_JOBS:-5}"

      - name: Verify kernel patch stack (early gate)
        # `git apply --check` 只能证明外层补丁能写进 ImmortalWrt 树，证明不了
        # 内嵌的 795-10/11/12 内核补丁能打到解压后的 linux 源码树。
        # CI run 42396108778 就是一路跑到 toolchain/kernel-headers 才在
        # include/net/dsa.h 上挂掉，白白烧掉 2h10m。下载完源码后先做一次
        # dry-run：从 dl/ tarball 重建 DSA 头文件、回放上游补丁栈，再校验
        # 795-11 的上下文。失败会在几秒内暴露，不需要等全量编译。
        run: |
          python3 scripts/check-kernel-patches.py --tree immortalwrt

      - name: Build firmware
        env:
          # OpenWrt 的 rules.mk 在 CONFIG_CCACHE=y 时会自己 export
          #   CCACHE_DIR=$(TOPDIR)/.ccache   （本仓库上就是 immortalwrt/.ccache）
          #   CCACHE_BASEDIR=$(TOPDIR)，且强制 CCACHE_NOCOMPRESS=true。
          # 所以这里只显式给 maxsize，其余交给它自己管，避免两边打架。
          #
          # maxsize 压到 1G 是配额考虑：GitHub 单仓库缓存上限 10G，
          # dl/ 两个基线已占 4.8G，staging_dir 本身还要 3-5G。
          # ccache 命中率前 1G 最高，再多收益递减但会把 dl/ 挤掉。
          CCACHE_MAXSIZE: 1G
        run: |
          cd immortalwrt
          echo "=== ccache before ==="
          ccache -s 2>/dev/null || echo "(ccache 尚未初始化)"

          JOBS="${BUILD_JOBS:-5}"
          # 并行失败时改用 -j1 V=s 重跑，配合 ccache 已编译的目标会直接命中，
          # 比从前从零串行重来便宜得多。
          echo "building with -j$JOBS"
          make -j"$JOBS" || {
            echo "::group::verbose retry log (make -j1 V=s)"
            make -j1 V=s
            echo "::endgroup::"
            exit 1
          }

          echo "=== ccache after ==="
          ccache -s 2>/dev/null || true

      - name: Show images
        run: |
          ls -lh immortalwrt/bin/targets/mediatek/filogic/ || true

      - name: Generate release notes
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          IMGDIR=immortalwrt/bin/targets/mediatek/filogic
          SYS=$(ls "$IMGDIR" 2>/dev/null | grep 'glinet_gl-mt5000-squashfs-sysupgrade.bin$' | head -n1)
          [ -n "$SYS" ] || SYS="(见附件)"
          [ "$INCLUDE_DOCKER" = "true" ] && DOCKER_OPT='已集成' || DOCKER_OPT='未集成'
          if [ "$ENABLE_MWAN3" = "true" ]; then MWAN3_OPT='已集成 (仅接管 IPv4; 已打 IPv6 防打标修复)'; else MWAN3_OPT='未集成'; fi
          if [ "$PPPOE" = "true" ]; then PPPOE_OPT="已预置 (账号密码不显示)"; else PPPOE_OPT='未预置 (DHCP)'; fi
          if [ "$ENABLE_IPV6" = "true" ]; then
            if [ "$LAN_IPV6_DNS" = "true" ]; then IPV6_DNS_OPT='通告 IPv6 DNS'; else IPV6_DNS_OPT='不通告 IPv6 DNS(DNS 走 IPv4)'; fi
            IPV6_OPT="已启用 (WAN 委托前缀 + LAN RA/SLAAC, ip6assign=$LAN_IPV6_ASSIGN, 后缀 $LAN_IPV6_SUFFIX, DHCPv6 $LAN_IPV6_DHCPV6, $IPV6_DNS_OPT)"
          else
            IPV6_OPT='未启用 (首启脚本不写 IPv6 配置)'
          fi
          if [ -z "$ROOT_PASSWORD" ]; then
            ROOTPWD_OPT='无密码'
            LOGIN_NOTE='账号 root,无密码,请尽快设置'
          else
            if [ "$ROOT_PASSWORD" = "root" ]; then ROOTPWD_OPT='root(弱口令)'; else ROOTPWD_OPT='自定义(不回显)'; fi
            LOGIN_NOTE="账号 root,密码 $ROOTPWD_OPT,请尽快修改"
          fi

          {
            echo "## ImmortalWrt — GL.iNet MT5000 (Brume 3)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 构建编号 | r${{ github.run_number }} |"
            echo "| 基础版本 | \`$IWRT_REF\` → \`${BASE_SHA:0:10}\` |"
            echo "| 构建时间 | $DATE |"
            echo "| 默认 LAN IP | \`$LAN_IP\` |"
            echo "| 时区 / 语言 | $TIMEZONE / $UI_LANG |"
            echo "| 软件包分区 | ${ROOTFS_SIZE} MB |"
            echo "| LuCI 套件 | \`luci\` 全套 (含 uhttpd) |"
            echo "| Docker | $DOCKER_OPT |"
            echo "| mwan3 多线 | $MWAN3_OPT |"
            echo "| PPPoE | $PPPOE_OPT |"
            echo "| IPv6 | $IPV6_OPT |"
            echo "| 主机名 | $HOSTNAME |"
            echo "| root 密码 | $ROOTPWD_OPT |"
            echo ""
            echo "### 固件内置"
            echo ""
            echo "- MT5000 设备支持(上游 PR [openwrt#24237](https://github.com/openwrt/openwrt/pull/24237) 移植 + 审阅反馈修复)"
            echo "- 已在本项目固件之间升级时 sysupgrade 可保留配置(eMMC + platform_copy_config)"
            echo "- LuCI 全套(luci 合集: uhttpd + mod-admin-full/network/status/system + bootstrap 主题 + 软件包管理)"
            echo "- 25.12 filogic 默认包集对齐:block-mount/default-settings-chn/kmod-nf-nathelper/luci"
            echo "- 基础增强:bash/curl/ip-full"
            echo "- autocore 状态页(CPU 型号/频率/温度)"
            if [ "$ENABLE_MWAN3" = "true" ]; then
              echo "- mwan3 多线管理(有线/随身WiFi/手机共享 优先级与故障转移, LuCI「网络→Multi WAN」; 已限定只接管 IPv4, 不会影响 IPv6)"
            fi
            echo "- 首启自动清理会 404 的 apk 软件源"
            echo ""
            echo "### 刷机方法"
            echo ""
            echo "1. 主升级文件:\`$SYS\`"
            echo "2. 原厂固件:管理界面「升级」页直接上传该文件;或在 SSH 中执行"
            echo '   ```'
            echo '   sysupgrade -n /tmp/*.bin   # -n 不保留配置(从原厂升级务必使用)'
            echo '   ```'
            echo "3. 已在 ImmortalWrt:系统「备份/升级」页上传,可保留配置"
            echo "4. 刷机后访问 http://$LAN_IP ($LOGIN_NOTE)"
            echo ""
            echo "> 完整校验值见附件 sha256sums;软件清单见 *.manifest;构建配置见 config.buildinfo"
          } > release_notes.md

          echo "=== release notes ==="
          cat release_notes.md

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt5000-master-r${{ github.run_number }}-${{ env.IWRT_REF }}
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*glinet_gl-mt5000*
            immortalwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt/bin/targets/mediatek/filogic/config.buildinfo
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mt5000-r${{ github.run_number }}
          name: MT5000 固件 (master) r${{ github.run_number }} (base ${{ env.IWRT_REF }})
          body_path: release_notes.md
          # 不加 *.manifest: 会被 *glinet_gl-mt5000* 重复匹配, 同一文件并发上传
          # 两次会撞 action-gh-release 同名资产竞态 (r25 的 release 因此卡死在 draft)
          files: |
            immortalwrt/bin/targets/mediatek/filogic/*glinet_gl-mt5000*
            immortalwrt/bin/targets/mediatek/filogic/sha256sums
            immortalwrt/bin/targets/mediatek/filogic/config.buildinfo
